<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M4B Slot Booking Demo</title><style>body{font:16px system-ui;margin:0;background:#f1f5f9;color:#172334}main{max-width:600px;margin:24px auto;padding:20px;background:white;border-radius:18px}label{display:block;margin:15px 0 5px}select,input,button{width:100%;padding:12px;font:inherit;box-sizing:border-box;border-radius:9px;border:1px solid #b7c2ce}button{margin-top:18px;background:#126e57;color:white;border:0}small{color:#526273}.warn{background:#fff3cd;padding:12px;border-radius:9px}</style><main><h1>📅 M4B Training Booking</h1><p class="warn"><strong>Demo only:</strong> This page does not save or confirm reservations. A shared booking server is required before instructors can book real slots.</p><label for="date">Training date</label><input id="date" type="date" required><label for="facility">Facility</label><select id="facility"><option>CEET B737</option><option>CEET A330</option><option>Wet Drill</option><option>Fire & Smoke Trainer</option><option>Door Trainer B737</option><option>Door Trainer A330</option><option>Door Trainer A350</option><option>Room 205</option><option>Room 206</option></select><label for="slot">Time slot</label><select id="slot"><option>08:30–10:00</option><option>10:00–11:30</option><option>11:30–13:00</option><option>14:00–15:30</option><option>15:30–17:00</option></select><label for="instructor">Instructor</label><input id="instructor" maxlength="80" required placeholder="Instructor name"><label for="group">Training group</label><input id="group" maxlength="80" required placeholder="Group 1 / 2 / 3"><button id="preview">Preview booking request</button><p id="result" role="status"></p><small>First-come-first-served confirmation and conflict checks are not active in this demo.</small></main><script>document.querySelector('#date').value=new Date().toLocaleDateString('en-CA');document.querySelector('#preview').onclick=()=>{const ids=['date','facility','slot','instructor','group'];const values=ids.map(id=>document.getElementById(id).value.trim());document.querySelector('#result').textContent=values.every(Boolean)?'REQUEST ONLY (not booked): '+values.join(' | '):'Please fill in all fields.';};</script></html>
